services:
  - type: web
    name: phoenixwasm
    runtime: docker
    plan: free
    repo: https://github.com/pilotbellyt-spec/PhoenixWASM
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: APPIMAGE_URL
        sync: false
      - key: APPIMAGE_SHA256
        sync: false
